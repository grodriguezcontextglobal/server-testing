<!DOCTYPE html>
<html lang="en-US" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <meta property="og:title" content="Devitrak Server Status" />
    <meta property="og:type" content="website" />
    <meta
      property="og:description"
      content="Devitrak Server: Backend infrastructure powering the Devitrak Inventory Management System. Monitor server status, performance metrics, and system health for optimal operation."
    />
    <meta name="theme-color" content="#1976d2" />
    <meta
      http-equiv="Cache-Control"
      content="private, must-revalidate, proxy-revalidate, max-age=0"
    />
    <meta
      name="keywords"
      content="devitrak server, system status, server monitoring, api status, backend infrastructure, server health, system metrics, performance monitoring, server dashboard, devitrak backend, api monitoring, system status page"
    />
    <meta
      name="description"
      content="Devitrak Server: Backend infrastructure powering the Devitrak Inventory Management System. Monitor server status, performance metrics, and system health for optimal operation."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="assets/devitrak-logo-white.svg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Devitrak Server Status</title>
  </head>
  <body>
    <header
      class="server-header"
      style="
        background-color: #155dee;
        display: flex;
        border-radius: 12px;
        padding: 8px 12px;
      "
    >
      <img
        src="assets/devitrak-logo-white.svg"
        alt="Devitrak Logo"
        class="logo"
      />&nbsp;
      <h3 style="color: #fff">Devitrak Server Status</h3>
    </header>

    <main class="server-content">
      <section class="status-panel">
        <h2>System Status</h2>
        <div class="status-grid">
          <div class="status-item">
            <h3>API Status</h3>
            <p id="apiStatus">Checking...</p>
          </div>
          <div class="status-item">
            <h3>Server Version</h3>
            <p id="serverVersion">Loading...</p>
          </div>
          <div class="status-item">
            <h3>Last Updated</h3>
            <p id="lastUpdated">Loading...</p>
          </div>
          <div
            class="status-item"
            id="systemInfoPanel"
            style="display: none; grid-column: 1 / -1"
          >
            <h3>System Information</h3>
            <pre
              id="systemInfo"
              style="
                font-family: monospace;
                font-size: 0.9rem;
                margin-top: 0.5rem;
                white-space: pre-wrap;
              "
            ></pre>
          </div>
        </div>
      </section>
    </main>

    <footer class="server-footer">
      <p>
        &copy; <span id="currentYear"></span> Devitrak. All rights reserved.
      </p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
