# Guardia de main (CM-3, CM-5; 2026-11-05).
#
# Control DETECTIVO: marca en rojo todo push a main cuyo commit no llegó por un
# pull request mergeado contra main. No impide el push; eso lo hace el ruleset
# .github/rulesets/protect-main.json (scripts/apply-branch-protection.ps1), que
# en un repo privado del plan Free GitHub no deja activar. Con el ruleset
# activo, este workflow queda como segunda línea y evidencia para la auditoría.

name: main-guard

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  came-from-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: El commit de main viene de un PR mergeado
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          prs=$(gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main") | "#\(.number) \(.title)"] | join(", ")')
          if [ -z "$prs" ]; then
            echo "::error::Push directo a main ($SHA, por $ACTOR) sin PR mergeado. Todo cambio a main va por PR con CI en verde."
            {
              echo "## Push directo a main"
              echo "Commit \`$SHA\` empujado por **$ACTOR** sin un pull request mergeado contra main."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "OK: $SHA llegó por $prs" | tee -a "$GITHUB_STEP_SUMMARY"
