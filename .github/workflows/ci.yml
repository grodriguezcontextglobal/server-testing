# CI del servidor (FedRAMP P1.6 · CM-3, RA-5 · KSI-CMT).
#
# Corre en cada push y en cada pull request. Es la red que sostiene el resto de
# la Fase 1: cada arreglo de seguridad tiene un test que lo fija, y sin CI esos
# tests solo protegen si alguien se acuerda de correrlos.
#
# Tres trabajos independientes:
#   test   la suite completa (node --test). No necesita bases de datos: los tests
#          stubean Mongo, MySQL y Redis. Solo hacen falta dos variables con valor
#          ficticio, porque dos módulos construyen su cliente al cargarse.
#   audit  bloquea si una dependencia de producción tiene una vulnerabilidad
#          CRÍTICA. Empieza en critical porque hoy hay 0 críticas y 8 altas
#          (7 de pm2 y 1 de follow-redirects); subir el umbral a high cuando se
#          cierren esas (tarea P1.13 del plan).
#   go     vet + build del worker de Go. En las máquinas de desarrollo no hay Go,
#          así que hasta ahora un .go roto solo se descubría al compilar en prod.
#
# Lo que este fichero NO hace (ajustes del repositorio en GitHub, no código):
#   - exigir que pase y una revisión antes de mergear a main / release/*
#     (Settings > Branches > branch protection rules);
#   - activar Dependabot security updates (Settings > Code security).

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # Valores ficticios: controller/transaction.js crea el cliente de
          # Stripe al cargarse y helpers/jwt.js firma con la semilla.
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          SECRET_JWT_SEED: ci-placeholder-seed

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=critical

  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go-worker/go.mod
          cache-dependency-path: go-worker/go.sum
      - run: go vet ./...
      - run: go build ./...
